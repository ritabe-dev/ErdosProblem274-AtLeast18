name: Full Lean review verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          use-github-cache: false
          build: false
      - name: Record fixed source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "sha=$GITHUB_SHA"
            git status --short --branch
            python3 --version
            lake --version
          } | tee "$RUNNER_TEMP/ci-identity.txt"
      - name: Run release-candidate checks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_release.sh 2>&1 |
            tee "$RUNNER_TEMP/release-check.log"
      - name: Install manuscript compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Compile manuscript source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_pdf.sh --compile 2>&1 |
            tee "$RUNNER_TEMP/manuscript-build.log"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ci-identity.txt
            ${{ runner.temp }}/release-check.log
            ${{ runner.temp }}/manuscript-build.log
          if-no-files-found: warn
          retention-days: 90
